<!DOCTYPE html>

  <meta name="theme-color" content="#6c5ce7" />
  <meta name="description"

<body class="furi-on">

            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
          </svg>
          <span id="cloudStatusDot" style="display:none; position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:#10b981; box-shadow:0 0 6px #10b981;"></span>
        </button>
        <button class="icon-btn sq" id="themeToggle" title="Ganti tema">
          <svg class="svg-ico" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
